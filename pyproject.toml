[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "av-stack"
version = "0.1.0"
description = "Modular autonomous-vehicle stack: sensors, perception, planning, control, safety guardrail"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/<OWNER>/av-stack"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python"]

[tool.scikit-build.cmake.define]
CMAKE_CXX_STANDARD = "17"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
